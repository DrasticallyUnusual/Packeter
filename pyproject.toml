[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "packeter"
version = "0.1.0"
description = "Download packages for offline installation"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
packeter = "packeter.gui:run"

[tool.setuptools.packages.find]
include = ["packeter*"]
